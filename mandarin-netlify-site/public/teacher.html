{id:"u1g",unit:1,title:"Favorites and comparing: 最, 更, 可是",zh:"最喜欢",can:"I can say what I like most, what I like more, and contrast two things with 可是.",
 vocab:[["最","zuì","most","x"],["更","gèng","even more, more","x"],["可是","kěshì","but","x"],["最喜欢","zuì xǐhuan","to like the most"],["更喜欢","gèng xǐhuan","to like even more"],["最容易","zuì róngyì","easiest"],["最有意思","zuì yǒu yìsi","most interesting"],["最好","zuì hǎo","best"],["更难","gèng nán","more difficult"],["更有意思","gèng yǒu yìsi","more interesting"],["更好","gèng hǎo","better"]],

const MASTER=.85,ROUNDS=3,$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let DATA=[],sortK="name",sel=null,filt="";
function mod(st,obj,m){ if(m==="S"){ const d=st.reviews.filter(r=>r.obj===obj&&r.kind==="speaking"&&r.status==="reviewed").sort((a,b)=>a.ts-b.ts),l=d[d.length-1]; return {pct:l?l.pct:null,ok:!!l&&l.pct>=MASTER*100}; }
 const rs=st.rounds.filter(r=>r.obj===obj&&r.mod===m).sort((a,b)=>a.ts-b.ts),w=rs.slice(-ROUNDS); if(!rs.length) return {pct:null,ok:false};
 const c=w.reduce((a,r)=>a+r.correct,0),t=w.reduce((a,r)=>a+r.total,0),p=Math.round(100*c/t); return {pct:p,ok:w.length>=ROUNDS&&p>=MASTER*100}; }
const cls=p=>p==null?"n":p>=85?"g":p>=65?"y":"r", pill=p=>`<span class="p ${cls(p)}">${p==null?"–":p+"%"}</span>`;
function sum(st){ const rs=st.rounds.filter(r=>r.obj!=="plc"); const last=rs.slice(-10),c=last.reduce((a,r)=>a+r.correct,0),t=last.reduce((a,r)=>a+r.total,0);
 let mastered=0; OBJ.forEach(o=>{ if(["L","R","W"].every(m=>mod(st,o.id,m).ok)) mastered++; });
 return {name:(st.profile&&st.profile.name)||st.name||st.email,rounds:rs.length,recent:t?Math.round(100*c/t):null,mastered,last:st.updated||0,pend:st.reviews.filter(r=>r.status==="pending").length}; }
function ago(t){ if(!t) return "–"; const d=(Date.now()-t)/864e5; return d<1?"today":d<2?"yesterday":Math.floor(d)+" days ago"; }

 document.querySelectorAll("th").forEach(h=>h.onclick=()=>{sortK=h.dataset.k;list()}); document.querySelectorAll("tr.s").forEach(r=>r.onclick=()=>{sel=DATA[+r.dataset.i];detail()});

function csv(){ const h=["Name","Email","Last active","Rounds","Recent score","Skills mastered"]; const rows=DATA.map(s=>{const m=sum(s);return [m.name,s.email,m.last?new Date(m.last).toISOString().slice(0,10):"",m.rounds,m.recent??"",m.mastered]});
 const t=[h,...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n"); const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"})); a.download="mandarin-class.csv"; a.click(); }
async function load(tok){ $("#sub").textContent="Loading…"; const r=await fetch("/api/teacher",{headers:{Authorization:"Bearer "+tok}});
 if(!r.ok){ $("#sub").textContent=r.status===403?"This account is not on the teacher list.":"Could not load ("+r.status+"). Try signing in again."; return; }
 DATA=(await r.json()).students; $("#sub").textContent="Class progress, updated live from student accounts."; $("#gbtn").remove(); list(); }
